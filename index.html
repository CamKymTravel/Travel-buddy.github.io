<!doctype html>
<html lang="en-AU">
<head>

  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>html,body{margin:0;min-height:100%;background:#071018;color:#f4f7fb}</style>
  <link rel="manifest" href="./manifest.webmanifest">

  <link rel="stylesheet" href="./styles.css">
  <title>Travel Buddy</title>
</head>
<body>
  <div id="launch" class="launch-screen" aria-live="polite">

    </div>
    <div id="launchBrand" class="launch-stage is-visible">
      <img class="launch-logo" src="./travel-buddy-pink-512.png" alt="" aria-hidden="true" width="512" height="512" decoding="sync" fetchpriority="high">
      <div class="launch-title">Travel Buddy</div>
      <div class="launch-kicker">Explore More</div>
    </div>
    <div id="launchStay" class="launch-stage"></div>
  </div>
  <div id="app" class="app-shell" hidden>
    <main id="screen" class="screen" tabindex="-1"></main>
    <nav id="bottomNav" class="bottom-nav" aria-label="Primary navigation">

      <button class="nav-item" data-route="expenses" type="button"><span class="nav-icon premium-nav-art" aria-hidden="true"><svg viewBox="0 0 40 40"><rect x="8" y="5" width="24" height="30" rx="6" fill="#1f7596"/><path d="M13 13h14M13 19h10M13 25h8" stroke="#b9f1fb" stroke-width="3" stroke-linecap="round"/><circle cx="28" cy="28" r="7" fill="#3bb8df"/><path d="M28 24v8M24 28h8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></span><b>Expenses</b></button>

      <button class="nav-item" data-route="settings" type="button"><span class="nav-icon premium-nav-art" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M8 12h24M8 20h24M8 28h24" stroke="#9cb2c0" stroke-width="3.2" stroke-linecap="round"/><circle cx="16" cy="12" r="5" fill="#5ec9df"/><circle cx="26" cy="20" r="5" fill="#a07bdf"/><circle cx="14" cy="28" r="5" fill="#e1b44c"/></svg></span><b>Settings</b></button>
    </nav>
  </div>
  <input id="shoppingImportFile" type="file" accept="application/json,.json" hidden>
  <div id="dialogRoot" class="dialog-root" hidden aria-live="assertive"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
