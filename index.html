<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1118">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Travel Buddy">
  <style>html,body{margin:0;min-height:100%;background:#071018;color:#f4f7fb}</style>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./travel-buddy-pink-180.png">
  <link rel="preload" as="image" href="./travel-buddy-pink-512.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Travel Buddy</title>
</head>
<body>
  <div id="launch" class="launch-screen" aria-live="polite">
    <div class="launch-scene" aria-hidden="true">
      <svg class="launch-mountains" viewBox="0 0 400 180" preserveAspectRatio="none"><path d="M0 180V126l45-33 30 18 46-57 42 42 33-20 44 47 34-31 43 34 42-23 41 32v45Z"/><path d="M0 180v-28l44-17 42 12 45-28 52 32 45-18 37 24 47-21 48 14 40-8v38Z"/></svg>
      <svg class="launch-route" viewBox="0 0 260 80"><path d="M8 58c42-56 110 24 176-24 20-14 38-18 66-10"/><path class="launch-plane" d="m230 9 20 8-20 8 5-7-12-1 12-1-5-7Z"/></svg>
    </div>
    <div id="launchBrand" class="launch-stage is-visible">
      <img class="launch-logo" src="./travel-buddy-pink-512.png" alt="" aria-hidden="true" width="512" height="512" decoding="sync" fetchpriority="high">
      <div class="launch-title">Travel Buddy</div>
      <div class="launch-kicker">Expenses · Shopping · Offline</div>
    </div>
    <div id="launchStay" class="launch-stage"></div>
  </div>
  <div id="app" class="app-shell" hidden>
    <main id="screen" class="screen" tabindex="-1"></main>
    <nav id="bottomNav" class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-item is-active" data-route="home" type="button" aria-current="page"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 11.2 12 4l8.5 7.2v8.3H15v-5h-6v5H3.5z"/></svg></span><b>Home</b></button>
      <button class="nav-item" data-route="expenses" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M7 9h10M7 15h10"/><circle cx="12" cy="12" r="2.2"/></svg></span><b>Expenses</b></button>
      <button class="nav-item" data-route="shopping" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 5h2l2.2 9h9.8l2-6H6.2"/><circle cx="9" cy="18" r="1.4"/><circle cx="17" cy="18" r="1.4"/></svg></span><b>Shopping</b></button>
      <button class="nav-item" data-route="settings" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M8 4v6M16 14v6"/><circle cx="8" cy="7" r="2"/><circle cx="16" cy="17" r="2"/></svg></span><b>Settings</b></button>
    </nav>
  </div>
  <input id="shoppingImportFile" type="file" accept="application/json,.json" hidden>
  <div id="dialogRoot" class="dialog-root" hidden aria-live="assertive"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
